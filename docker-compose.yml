services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: resumes
      POSTGRES_USER: resumes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resumes"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 15

  app:
    build: .
    command: ["serve"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    models:
      - llm
      - embed
    environment:
      DATABASE_URL: postgres://resumes:${POSTGRES_PASSWORD}@postgres:5432/resumes?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      STORAGE_DIR: /data/resumes
      HTTP_PORT: "8080"
    volumes:
      - resumedata:/data/resumes

  worker:
    build: .
    command: ["worker"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    models:
      - llm
      - embed
    environment:
      DATABASE_URL: postgres://resumes:${POSTGRES_PASSWORD}@postgres:5432/resumes?sslmode=disable
      KAFKA_BROKERS: kafka:9092
    volumes:
      - resumedata:/data/resumes

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

models:
  llm:
    model: ai/llama3.2:latest
  embed:
    model: ai/nomic-embed-text-v1.5

volumes:
  pgdata:
  resumedata:
  caddy_data:
  caddy_config:
